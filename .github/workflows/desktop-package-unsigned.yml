name: Package Windows x64 (unsigned)

# Produce an unsigned Windows x64 installer on a hosted Windows runner, so a
# local machine does not need Python + Visual C++ build tools to cut a
# test/acceptance build. This is a fork-local release lane (in the ops 二开
# workflow): signing, notarization, and auto-update origin stay outside scope.
# On manually triggering, set `app_id` to the release application id; on a
# `main` push the `DSH_DESKTOP_APP_ID` repository variable is used when set.

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: DSH_DESKTOP_APP_ID for the unsigned build
        required: false
        default: ''
  push:
    branches: [main]

concurrency:
  group: desktop-unsigned-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

env:
  NODE_VERSION: '24'
  # The desktop shell reads this to register the release identity; the value is
  # an app id for the unsigned artifact (no signing credentials are involved).
  DSH_DESKTOP_APP_ID: ${{ inputs.app_id != '' && inputs.app_id || vars.DSH_DESKTOP_APP_ID }}

jobs:
  package-win-x64-unsigned:
    name: package / windows x64 unsigned
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        shell: pwsh
        run: pnpm install --frozen-lockfile

      # The frozen baseline (c291e796) predates the upstream commit that added
      # fs-ext to the desktop packaging closure, so the native payload smoke
      # in prepare:dsh cannot resolve it. This injects fs-ext into the
      # @deepseek-ai/dsh aggregate ONLY in this build's working copy (never
      # committed) so the packed dsh closure carries it. The repository-root
      # allowBuilds whitelist denies fs-ext's install script (the desktop
      # packaging temp project already allows it), so the working copy's
      # pnpm-workspace.yaml is patched in place first; the packaging-stage
      # allowBuilds from project-manager.ts handles the build-time compile.
      - name: Inject fs-ext into the dsh closure (working copy only)
        shell: pwsh
        run: |
          $ws = 'pnpm-workspace.yaml'
          $content = [System.IO.File]::ReadAllText($ws)
          if ($content -notmatch 'fs-ext') {
            $content = $content -replace "(?m)^allowBuilds:\r?\n", "allowBuilds:`n  fs-ext: true`n"
            [System.IO.File]::WriteAllText($ws, $content, [System.Text.UTF8Encoding]::new($false))
          }
          pnpm --filter @deepseek-ai/dsh add fs-ext@2.1.1

      - name: Package Windows x64 unsigned
        shell: pwsh
        run: pnpm run package:desktop:win:x64:unsigned

      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-win-x64-unsigned
          path: .desktop-build/targets/win-x64/unsigned-artifacts/
          if-no-files-found: error
          retention-days: 14